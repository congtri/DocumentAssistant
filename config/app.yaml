app:
  name: DocumentAssistant
  version: 1.0.0
  host: 127.0.0.1
  port: 8080
  debug: false

documents:
  source_dir: documents/source
  processed_dir: documents/processed
  supported_formats:
    - pdf
    - docx
    - md

data:
  chunks_dir: data/chunks
  embeddings_dir: data/embeddings
  indexes_dir: data/indexes
  cache_dir: data/cache

logging:
  level: INFO
  file: logs/app.log
