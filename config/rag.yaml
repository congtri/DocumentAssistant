chunking:
  method: heading
  chunk_size: 512
  chunk_overlap: 50
  min_chunk_size: 100

embedding:
  model_name: all-MiniLM-L6-v2
  model_path: models/embeddings
  dimension: 384
  batch_size: 32

retrieval:
  top_k: 5
  bm25_weight: 0.4
  vector_weight: 0.6
  rerank: true
  rerank_top_k: 3

rag:
  max_context_length: 4096
  temperature: 0.7
  max_tokens: 1024
  system_prompt: |
    You are a helpful document assistant. Answer questions based on the provided context.
    If the answer is not in the context, say so clearly.
    Always cite sources with document name and page number when available.
